[package]
name = "ct-av1-fgs-engine"
version = "1.1.0"
edition = "2021"
authors = ["Anything2134"]
description = "CT-AV1-FGS-ENGINE: Advanced Hybrid Celluloid & Digital Noise AV1 Film Grain Synthesis Engine"
license = "GPL-3.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
